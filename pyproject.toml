[project]
name = "unity-docs-scraper"
version = "0.1.0"
description = "Turn the Unity documentation (any editor version) into LLM-friendly Markdown/JSONL."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
]

[project.scripts]
unity-docs = "unity_docs_scraper.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/unity_docs_scraper"]
